<!-- LingoPal records or uploads audio and displays its transcription. -->


<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio Recorder</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Welcome to LingoPal</h1>
      <p>Press record to start capturing audio from your day.</p>
      <div class="controls">
        <button id="record-button" type="button">Record</button>
        <button id="stop-button" type="button" disabled>Stop</button>
      </div>
      <div class="controls">
        <button id="upload-button" type="button">Upload audio</button>
        <input id="audio-file" type="file" accept="audio/*" hidden>
        <button id="play-button" type="button" disabled>Play audio</button>
      </div>


      <p id="status" role="status" aria-live="polite">Ready to record.</p>
      <audio id="playback" controls hidden></audio>


      <section aria-labelledby="transcript-heading">
        <h2 id="transcript-heading">Transcript</h2>
        <p id="transcript" aria-live="polite">Transcribed text will appear here.</p>
      </section>
      <section aria-labelledby="recordings-heading">
        <!-- <h2 id="recordings-heading">Saved recordings</h2> -->
        <ul id="recordings-list"></ul>
      </section>

      <div class="translation-section">
        <h2>Translation</h2>

        <!-- Add a dropdown menu for the user to select the target language -->
        <select id="targetLanguage">
            <option value="fr">French</option>
        </select>
        
        <!-- Add a text input for the user to enter text to translate -->
        <div class="translation-input">
            <input type="text" id="inputText" placeholder="Enter text to translate">
            
          </div>
        <div class="translation-button">
            <button type="button" id="translateButton">Translate</button>
        </div>
        <p id="translatedText" aria-live="polite"></p>
        </div>


  
    </main>
    <script src="Front_end_code/TranslateText.js"></script>
    <script src="Front_end_code/Button.js"></script>
    <script src="Front_end_code/Button_Implementation.js"></script>
  </body>
</html>
